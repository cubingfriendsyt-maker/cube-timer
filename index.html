<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube-Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="timertextcontainer">
    <h1 id="timertext">0.00</h1>
  </div>
  <script>
    const ttc = document.getElementById("timertextcontainer");
    var holdTimer;
    window.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      if (event.key == " ") {
        ttc.style.backgroundColor = "red";
        holdTimer = setTimeout(() => {
          holdTimer = null;
          ttc.style.backgroundColor = "green";
        }, 550);
      }
    });
    window.addEventListener("keyup", (event) => {
      if (!event.key == " ") return;
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
        ttc.style.backgroundColor = "";
      }
    });
  </script>
</body>
</html>
